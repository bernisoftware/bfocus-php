# TEMPORÁRIO — verifica as credenciais de publicação (não publica nada; imprime só ok/falhou).
# Some no 1º release: o scripts/release-sdks.sh do monorepo substitui o conteúdo deste espelho.
name: verifica-credenciais
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Packagist aceita PACKAGIST_USERNAME + PACKAGIST_TOKEN
        env:
          U: ${{ secrets.PACKAGIST_USERNAME }}
          T: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          [ -n "$U" ] && [ -n "$T" ] || { echo "::error::PACKAGIST_USERNAME ou PACKAGIST_TOKEN vazio"; exit 1; }
          code=$(curl -s -o r.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $U:$T" \
            --data '{"repository":{"url":"https://github.com/bernisoftware/bzapper-php"}}' \
            https://packagist.org/api/update-package)
          echo "Packagist HTTP $code — $(jq -r '.status // empty' r.json 2>/dev/null) $(jq -r '.message // empty' r.json 2>/dev/null)"
          case "$code" in 200|202) echo "OK: Packagist aceitou";; *) echo "::error::Packagist recusou (HTTP $code)"; exit 1;; esac
