# TEMPORÁRIO — verifica as credenciais de publicação (não publica nada; imprime só ok/falhou).
# Some no 1º release: o scripts/release-sdks.sh do monorepo substitui o conteúdo deste espelho.
name: verifica-credenciais
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Packagist aceita PACKAGIST_USERNAME + PACKAGIST_TOKEN
        env:
          U: ${{ secrets.PACKAGIST_USERNAME }}
          T: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          [ -n "$U" ] && [ -n "$T" ] || { echo "::error::PACKAGIST_USERNAME ou PACKAGIST_TOKEN vazio"; exit 1; }
          # FORMATO do que foi gravado, sem o valor: acusa e-mail no lugar do usuário, espaço/quebra de
          # linha colados junto, ou texto que não tem cara de token.
          shape() { v=$1; printf 'comprimento %s' "${#v}"
            case "$v" in *@*) printf ', tem @ (parece e-mail)';; esac
            case "$v" in *' '*|*$'\t'*|*$'\n'*|*$'\r'*) printf ', TEM espaço/quebra de linha';; esac
            printf '%s' "$v" | grep -qE '^[A-Za-z0-9._-]+$' && printf ', só letras/números' || printf ', tem outros caracteres'; }
          echo "PACKAGIST_USERNAME: $(shape "$U")"
          echo "PACKAGIST_TOKEN:    $(shape "$T")"
          # Pede para reler o pacote do bZapper (já existe): 202 = credenciais aceitas.
          body='{"repository":{"url":"https://github.com/bernisoftware/bzapper-php"}}'
          # 1) mesmo formato do publish.yml do espelho: username/apiToken na query
          qu=$(jq -rn --arg v "$U" '$v|@uri'); qt=$(jq -rn --arg v "$T" '$v|@uri'); echo "::add-mask::$qt"
          c1=$(curl -s -o r1.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" \
            "https://packagist.org/api/update-package?username=$qu&apiToken=$qt")
          echo "Packagist (query, como o publish.yml) HTTP $c1 — $(jq -r '[.status, .message] | map(select(.)) | join(" ")' r1.json 2>/dev/null)"
          # 2) forma alternativa: Authorization: Bearer usuário:token
          c2=$(curl -s -o r2.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" \
            -H "Authorization: Bearer $U:$T" https://packagist.org/api/update-package)
          echo "Packagist (Bearer) HTTP $c2 — $(jq -r '[.status, .message] | map(select(.)) | join(" ")' r2.json 2>/dev/null)"
          case "$c1" in 200|202) echo "OK: Packagist aceitou no formato do publish.yml"; exit 0;; esac
          case "$c2" in 200|202) echo "::warning::Packagist só aceitou via Bearer — ajustar o publish.yml"; exit 0;; esac
          echo "::error::Packagist recusou nas duas formas (HTTP $c1 / $c2)"; exit 1
